<main class="container">
  <form>
    <h1>Criar Conta</h1>

    <div class="input-box">
      <input placeholder="Nome Completo" type="text">
      <i class="bx bx-user"></i>
    </div>

    <div class="input-box">
      <input placeholder="E-mail" type="email">
      <i class="bx bx-envelope"></i>
    </div>

    <div class="input-box">
      <input placeholder="Criar Senha" type="password">
      <i class="bx bx-lock"></i>
    </div>

    <button type="submit" class="cadastro">Finalizar Cadastro</button>

    <div class="login-link">
      <p>Já tem uma conta? <a routerLink="/">Faça Login</a></p>
    </div>
  </form>
</main>
