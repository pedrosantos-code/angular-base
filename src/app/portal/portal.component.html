<seia-linhas-de-luz />

<div class="l-seia-container">

  <seia-topbar
    tema="claro"
    (navegar)="ir($event)"
    (sair)="sair()" />

  <!-- Conteúdo Principal da Página -->
  <main class="l-main-content">

    <!-- Sem fundo próprio: transparente pra deixar aparecer as linhas de luz atrás -->
    <header class="l-pt-hero seia-topo">
      <p class="l-pt-eyebrow"><i aria-hidden="true"></i>Portal SEIA + Ford</p>
    </header>

    <!-- Agente de Perfil: análise de cliente para o time comercial -->
    <seia-agente />

    <!-- Como a recomendação funciona -->
    <section class="l-steps-section">
      <h2>Como a recomendação funciona</h2>
      <div class="l-steps-divider"></div>
      <div class="l-steps-grid">
        @for (p of passos; track p.n) {
          <div class="l-step-card">
            <span class="l-step-number">{{ p.n }}</span>
            <h3 class="l-step-titulo">{{ p.titulo }}</h3>
            <p class="l-step-texto">{{ p.texto }}</p>
          </div>
        }
      </div>
    </section>

  </main>


  <seia-rodape />

</div>
