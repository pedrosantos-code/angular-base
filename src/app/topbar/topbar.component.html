<header class="l-sidebar">
  <div class="l-sidebar-header topbar">
    <div class="l-header-left">
      <!-- Botão do menu -->
      <button
        class="l-menu-toggle topbar-btn"
        type="button"
        (click)="alternar()"
        [attr.aria-label]="aberto ? 'Fechar menu' : 'Abrir menu'"
        [attr.aria-expanded]="aberto"
        aria-controls="menu-lateral">
        <svg class="icon-menu" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          @for (d of icones['menu']; track $index) { <path [attr.d]="d" /> }
        </svg>
      </button>

      <!-- Botão de perfil -->
      <button class="l-icon-btn topbar-btn" type="button" (click)="irPerfil()" aria-label="Meu perfil" title="Meu perfil">
        <svg class="icon-action" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          @for (d of icones['perfil']; track $index) { <path [attr.d]="d" /> }
        </svg>
      </button>
    </div>

    <!-- Marca Seia + Ford -->
    <button type="button" class="l-brand-wrapper" (click)="irHome()" aria-label="Ir para o início">
      <img src="seia-script.png" alt="Seia" class="l-brand-seia" />
      <span class="l-brand-plus brand-plus--header">+</span>
      <img src="ford-oval.png" alt="Ford" class="l-brand-ford" />
    </button>

    <!-- Botão de Sair / Logout -->
    <div class="l-header-right">
      <button class="l-icon-btn topbar-btn" type="button" (click)="sair.emit()" aria-label="Sair" title="Sair">
        <svg class="icon-action" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          @for (d of icones['sair']; track $index) { <path [attr.d]="d" /> }
        </svg>
      </button>
    </div>
  </div>

  <!-- Navegação Gaveta / Menu retrátil que responde ao estado 'aberto' -->
  <nav id="menu-lateral" class="l-sidebar-nav drawer" aria-label="Menu principal" [class.ativo]="aberto" [class.drawer--open]="aberto" [attr.inert]="aberto ? null : ''">
    <button type="button" class="l-drawer-brand" (click)="irHome()" aria-label="Ir para o início">
      <img src="seia-script.png" alt="Seia" class="l-brand-seia" />
      <span class="l-brand-plus">+</span>
      <img src="ford-oval.png" alt="Ford" class="l-brand-ford" />
    </button>
    <div class="drawer-divider"></div>

    <div class="l-nav-group drawer-group">
      <h3 class="l-nav-title drawer-group-title">PORTAL</h3>
      <ul>
        @for (i of principais; track i.chave) {
          <li>
            <button class="l-nav-link-btn drawer-link" type="button" [class.drawer-link--active]="ativo() === i.chave" [attr.aria-current]="ativo() === i.chave ? 'page' : null" (click)="ir(i.chave)">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                @for (d of icones[i.icone]; track $index) { <path [attr.d]="d" /> }
              </svg>
              {{ i.rotulo }}
            </button>
          </li>
        }
      </ul>
    </div>

    <div class="l-nav-group drawer-group">
      <h3 class="l-nav-title drawer-group-title">ATENDIMENTO</h3>
      <ul>
        @for (i of atendimento; track i.chave) {
          <li>
            <button class="l-nav-link-btn drawer-link" type="button" [class.drawer-link--active]="ativo() === i.chave" [attr.aria-current]="ativo() === i.chave ? 'page' : null" (click)="ir(i.chave)">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                @for (d of icones[i.icone]; track $index) { <path [attr.d]="d" /> }
              </svg>
              {{ i.rotulo }}
            </button>
          </li>
        }
      </ul>
    </div>

    <div class="l-nav-group drawer-group">
      <h3 class="l-nav-title drawer-group-title">SOBRE</h3>
      <ul>
        @for (i of sobre; track i.chave) {
          <li>
            <button class="l-nav-link-btn drawer-link" type="button" [class.drawer-link--active]="ativo() === i.chave" [attr.aria-current]="ativo() === i.chave ? 'page' : null" (click)="ir(i.chave)">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                @for (d of icones[i.icone]; track $index) { <path [attr.d]="d" /> }
              </svg>
              {{ i.rotulo }}
            </button>
          </li>
        }
      </ul>
    </div>
  </nav>
</header>

<!-- Overlay para fechar o menu ao clicar fora -->
<div class="overlay" [class.overlay--visible]="aberto" (click)="fechar()" aria-hidden="true"></div>
