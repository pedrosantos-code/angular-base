<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>SEIA + Ford</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Só na landing: começa a baixar a imagem principal do Hero antes de o Angular montar a página
      // (sem isso ela só é descoberta depois do JavaScript, e as outras rotas nem usam essa imagem).
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.setAttribute('fetchpriority', 'high');
        l.setAttribute('imagesrcset', 'hero-reveal/1x/base.webp 1024w, hero-reveal/2x/base.webp 2048w');
        l.setAttribute('imagesizes', '(min-width: 900px) 1400px, 94vw');
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
